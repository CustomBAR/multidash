[package]
name = "multidash"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "multidash"
path = "main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
local-ip-address = "0.6"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
